<!DOCTYPE html>
<html lang="en">
</html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<h1 id="title">QUICKCONNEKT </h1>
<h3 >Product Survey</h3>
<p id="description">Please fill out the survey to let us know what you think of our products, so we can improve in the future.</p>

<form id="survey-form">

<div id="inline"><label id="name-label">Full Name</label>
<input id="name" type="text" placeholder="Name" required></input>
</div>
<div id="inline">
<label id="email-label">Email Address</label>
<input id="email" type="email" placeholder="Email" required<input>
</div>

<div>
<label id="rating-label1">Select the product you are rating.</label>
</div>
<div id="app-option">
<input type="radio"  id="option1" name="option" value="App1">Calculator</input></div>
<div  id="app-option2">
<input type="radio" name="option" value="App2">Contact Book</input></div>
<div  id="app-option3">
<input type="radio" name="option" value="App3">Desktop Notifier</input></div>

<div id="rank">
<label id="number-label">Rank 1-10</label>
<input id="number" type="number" min="1" max="10" placeholder="#" required <input>
</div>

<div id="inline"><label for="dropdown" id="rating-label2">Will you be using QuickConnekt products for your future software application needs?</label>
<select name="dropdown" id="yesnomaybe">
<option value="Yes">Yes</option>
<option value="No">No</option>
<option value="Maybe">Maybe</option>
</select>
</div>
<div>
<input id="submit" type="submit" value="Submit"></input>
</div>
</form>

<footer>Copyright &copy; 2024 QuickConnekt</footer>
</body>
