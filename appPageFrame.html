    <div class="pagination">
        <button type="button" id="prev">&#8592;</button>
        <button type="button" id="next">&#8594;</button>
    </div>

    <script>
        var ang = 0;

        $("#prev").click(function () {
            ang = ang + 36;
            $("*").css("--ang", ang);
        });

        $("#next").click(function () {
            ang = ang - 36;
            $("*").css("--ang", ang);
        });
    </script>
