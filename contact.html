<main>
  <div class="contact-wrapper">
    <h2 class="section-title">Get In Touch</h2>
    <p class="section-subtitle">Bookings, collaborations, or just want to say hello?</p>

    <form class="contact-form" id="contact-form" novalidate>
      <div class="form-status" id="form-status"></div>

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="What's this about?" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Tell me more..." required></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-submit" id="submit-btn">Send Message</button>
    </form>

    <div class="contact-info">
      <p>You can also reach out on any platform — links are in the navigation bar above.</p>
    </div>
  </div>
